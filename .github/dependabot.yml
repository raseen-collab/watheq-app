# Dependabot (23 نوفمبر 2026): تنبيهات وتحديثات أمنية لمكتبات التطبيق — مجاني على GitHub.
# أسبوعيًّا، وتحديثات الأمان فقط تُفتح تلقائيًّا كـ PR (لا دمج تلقائي — عبيد يدمج).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
